<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Live</title>
  <style>
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      overflow: hidden !important;
    }

    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      overflow: hidden !important;
      background: black;
      font-family: sans-serif;
    }

    iframe {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 9999 !important;
    }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      border-radius: 50%;
      z-index: 10000;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(0,0,0,0.9);
    }

    .aviso {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div id="aviso" class="aviso">Carregando…</div>
<button class="close-btn" id="closeBtn" style="display:none;">✕</button>

<script>
  // Configuração é feita 1x só: preenche EMPRESA_ID e BACKEND_URL e nunca mais
  // precisa mexer aqui, mesmo quando uma live nova começar ou terminar — a
  // página descobre sozinha qual live está ao vivo pra essa empresa.
  var EMPRESA_ID = "COLOQUE_O_ID_DA_EMPRESA_AQUI";
  var BACKEND_URL = "COLOQUE_A_URL_DO_BACKEND_AQUI";
  var HOME_URL = "https://www.feiraodetoalhas.com.br/";

  var PLAYER_BASE_URL = "https://painel.venderiia.com.br/player/";
  var INTERVALO_MS = 20000;

  var avisoEl = document.getElementById("aviso");
  var closeBtn = document.getElementById("closeBtn");
  var iframeMostrado = false;

  function sairPraLoja() {
    window.location.href = HOME_URL;
  }

  function mostrarIframe(liveId) {
    if (iframeMostrado) return;
    iframeMostrado = true;
    avisoEl.remove();
    closeBtn.style.display = "block";

    var iframe = document.createElement("iframe");
    iframe.src = PLAYER_BASE_URL + liveId;
    iframe.setAttribute("allow", "autoplay");
    document.body.appendChild(iframe);
  }

  function checarStatus() {
    fetch(BACKEND_URL + "/lives/atual?empresa_id=" + EMPRESA_ID)
      .then(function (r) { return r.json(); })
      .then(function (info) {
        if (info.live_id) {
          mostrarIframe(info.live_id);
        } else if (iframeMostrado) {
          // a pessoa já estava assistindo e a live encerrou agora — volta pra loja.
          sairPraLoja();
        } else {
          // nenhuma live ao vivo agora pra essa empresa — não deixa entrar.
          sairPraLoja();
        }
      })
      .catch(function () {
        // se a checagem falhar e a live já estava sendo exibida, não derruba por causa
        // de uma falha de rede passageira; só não deixa entrar se ainda não tinha entrado.
        if (!iframeMostrado) sairPraLoja();
      });
  }

  checarStatus();
  setInterval(checarStatus, INTERVALO_MS);

  closeBtn.addEventListener('click', sairPraLoja);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') sairPraLoja();
  });
</script>

</body>
</html>
