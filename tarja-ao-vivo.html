<!--
  Tarja "AO VIVO" — cole logo depois da tag <body> do site. Fica escondida e
  só aparece quando a live estiver com status "ao_vivo" de verdade; em
  qualquer outro status (agendada, encerrada) ela some sozinha.

  Configuração é feita 1x só: preenche EMPRESA_ID e BACKEND_URL lá embaixo no
  <script> e nunca mais precisa mexer aqui, mesmo quando uma live nova
  começar ou terminar — o widget descobre sozinho qual live está ao vivo.
-->
<a id="tarja-ao-vivo" href="#" target="_top">
  🔴 AO VIVO — clique para assistir agora
</a>

<style>
  #tarja-ao-vivo {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    background: #dc2626;
    color: #fff;
    text-align: center;
    font-family: sans-serif;
    font-weight: bold;
    text-decoration: none;
    box-sizing: border-box;
    min-height: 48px;
    line-height: 48px;
    font-size: 16px;
  }

  @media (max-width: 1400px) {
    #tarja-ao-vivo {
      min-height: 44px;
      line-height: 44px;
      font-size: 15px;
    }
  }

  @media (max-width: 968px) {
    #tarja-ao-vivo {
      min-height: 40px;
      line-height: 40px;
      font-size: 13px;
    }
  }

  @media (max-width: 768px) {
    #tarja-ao-vivo {
      min-height: 36px;
      line-height: 36px;
      font-size: 12px;
      padding: 0 8px;
    }
  }
</style>

<script>
(function () {
  // EMPRESA_ID é fixo — não muda nunca, nem quando uma live começa/termina.
  // O widget pergunta pro backend "tem live ao vivo agora?" a cada 20s, então
  // não precisa saber o ID de uma live específica de antemão (e nunca fica
  // desatualizado pra quem já está com a aba aberta quando a live começa).
  var EMPRESA_ID = "COLOQUE_O_ID_DA_EMPRESA_AQUI";
  var BACKEND_URL = "COLOQUE_A_URL_DO_BACKEND_AQUI";
  var LIVE_PAGE_URL_BASE = "https://painel.venderiia.com.br/player/";
  var INTERVALO_MS = 20000;

  var tarja = document.getElementById("tarja-ao-vivo");

  function checarStatus() {
    fetch(BACKEND_URL + "/lives/atual?empresa_id=" + EMPRESA_ID)
      .then(function (r) { return r.json(); })
      .then(function (info) {
        if (info.live_id) {
          tarja.href = LIVE_PAGE_URL_BASE + info.live_id;
          tarja.style.display = "block";
        } else {
          tarja.style.display = "none";
        }
      })
      .catch(function () { /* mantém o estado atual se a checagem falhar */ });
  }

  checarStatus();
  setInterval(checarStatus, INTERVALO_MS);
})();
</script>
