<!--
  Widget de live shopping — cole esse bloco no site do e-commerce, no lugar
  onde a live deve aparecer. Ele mesmo decide se mostra ou esconde o player,
  checando o status da live a cada 20s (sem precisar reload da página).

  Configuração é feita 1x só: preenche EMPRESA_ID e BACKEND_URL abaixo e nunca
  mais precisa mexer aqui, mesmo quando uma live nova começar ou terminar —
  o widget descobre sozinho qual live está ao vivo pra essa empresa.
-->
<div id="live-shopping-widget" style="display:none; width:380px; max-width:100%; aspect-ratio:9/16;"></div>

<script>
(function () {
  // EMPRESA_ID é fixo — não muda nunca, nem quando uma live começa/termina.
  // O widget pergunta pro backend "tem live ao vivo agora?" a cada 20s, então
  // não precisa saber o ID de uma live específica de antemão (e nunca fica
  // desatualizado pra quem já está com a aba aberta quando a live começa).
  var EMPRESA_ID = "COLOQUE_O_ID_DA_EMPRESA_AQUI";
  var BACKEND_URL = "COLOQUE_A_URL_DO_BACKEND_AQUI";
  var PLAYER_BASE_URL = "https://painel.venderiia.com.br/player/";
  var INTERVALO_MS = 20000;

  var container = document.getElementById("live-shopping-widget");
  var liveIdAtual = null;

  function mostrarPlayer(liveId) {
    if (liveIdAtual === liveId && container.querySelector("iframe")) return;
    liveIdAtual = liveId;
    container.innerHTML = "";
    var iframe = document.createElement("iframe");
    iframe.src = PLAYER_BASE_URL + liveId;
    iframe.style.cssText = "width:100%;height:100%;border:none;";
    iframe.setAttribute("allow", "autoplay");
    container.appendChild(iframe);
    container.style.display = "block";
  }

  function esconderPlayer() {
    liveIdAtual = null;
    container.innerHTML = "";
    container.style.display = "none";
  }

  function checarStatus() {
    fetch(BACKEND_URL + "/lives/atual?empresa_id=" + EMPRESA_ID)
      .then(function (r) { return r.json(); })
      .then(function (info) {
        if (info.live_id) mostrarPlayer(info.live_id);
        else esconderPlayer();
      })
      .catch(function () { /* mantém o estado atual se a checagem falhar */ });
  }

  checarStatus();
  setInterval(checarStatus, INTERVALO_MS);
})();
</script>
